freeze_id: M02-FREEZE-1
frozen_on: 2026-10-02
mission: mission-02

purpose: >-
  Record the exact text of the game-family candidate cards, and of the ten vocabulary features
  they use, as authored before any Mission 02 Council response existed in this repository, so that
  the later comparison (seed Q-B) cannot be said to have used cards tuned to the family design that
  the Council produces.

status: >-
  Frozen, candidate, agent-proposed and unreviewed. Freezing is bookkeeping about authorship order.
  It does not validate the cards, and nothing here shows that any of them helps.

authorship: >-
  Written by the compiler agent (the AI agent working in this repository) on 2026-10-02. No human has
  reviewed them.

not_shown_to: >-
  The Mission 02 Council in round 1. The prompt hashes are in mission-02/council/README.md; the
  prompts contain the seed and the evidence digest and none of these cards.

ordering_evidence: >-
  The kickoff commit (seed, retrieval view, digest, four prompts) precedes the commit that adds this
  file and the cards, and both precede any stored Council response. Check with git log.

what_the_author_had_read_before_writing:
  - "The v0 epistemic_games core and judge, including the failure-mode taxonomy. Card game-policy-likelihood-identifiability overlaps that taxonomy by construction and is close to an answer hint on v0-like instances."
  - "The evidence digest (a reading list; most nodes carry no description text)."
  - "Search-result excerpts, not full texts, for: the reachability characterization of common knowledge (Aumann 1976), Rubinstein's electronic mail game, and the relation between rationalizability and iterated strict dominance (Bernheim 1984; Pearce 1984; correlated rationalizability). Nothing else was checked against a source."

rules_after_freeze: >-
  A change to a frozen card or feature means bumping the card's version and adding a new freeze
  entry (M02-FREEZE-2 and so on) that records what changed and why. An entry made after any Council
  response was stored must say so and be marked post_council: those cards can no longer be described
  as written without sight of the Council's design. tests/test_mission_02_freeze.py fails on any
  silent edit. It is a change-detector on purpose.

