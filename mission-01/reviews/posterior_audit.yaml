mission_id: "mission-01"
pre_registration_commit_sha: "cbd4e4a081d0b5b1af8a062b6cdf5c4a4ac7d4e7"
status: "quarantined_exploratory_not_calibrated_posterior"
source_artifacts:
  - "mission-01/spec/approved.yaml"
  - "mission-01/results/summary_metrics.json"
  - "mission-01/falsification/falsification_results.json"
findings:
  - id: "PA-01"
    issue: "The O1..O6 conditions are not a mutually exclusive categorical observation partition."
    evidence: >
      O4 is defined as O3 holding plus additional Part B / duality conditions; O5 and O6 are
      abort flags which can co-occur with other regimes. The numeric likelihood columns happen
      to sum to 1.0 across O1..O6 for each H, but that arithmetic does not make overlapping events
      mutually exclusive or specify their joint dependence.
    decision: "Do not treat the row set as a calibrated categorical likelihood model."
  - id: "PA-02"
    issue: "The Skeptic prior contains H4_or_Residual, which the WP-07 script split into H4 and H5."
    evidence: >
      spec/approved.yaml records 0.22 as H4_or_Residual. The script assigns 0.14 to H4 and 0.08
      to H5, with no separately registered justification for that decomposition.
    decision: "Do not treat the resulting pi_S posterior as a registered prior sensitivity result."
  - id: "PA-03"
    issue: "The composite likelihood uses a post-hoc geometric weighting."
    evidence: >
      tools/run_falsification_suite.py computes L(O4)^0.50 * L(O3)^0.30 * L(O6)^0.20. The frozen
      spec does not define this joint likelihood, its weights, or a conditional-independence model.
    decision: "Composite posterior fields in generated outputs are not inferential evidence."
  - id: "PA-04"
    issue: "Mapping the observed data to O3/O4/O6 was not generated by a frozen deterministic classifier."
    evidence: >
      WP-07 synthesis comments narrate which parts of the empirical results are said to realize
      each regime; the empirical observations span different cohorts/metrics and can jointly trigger
      multiple threshold flags.
    decision: "Any individual row update is illustrative reweighting only, not calibrated posterior evidence."
likelihood_column_sums_across_listed_regimes:
  H0: 1.0
  H1: 1.0
  H2: 1.0
  H3: 1.0
  H4: 1.0
  H5: 1.0
use_constraint: >
  Preserve all values in the generated files for auditability. Gate 3/Gate 4 prose must not claim
  calibrated Bayesian updating, posterior collapse, or posterior support for a scientific hypothesis
  from these fields. Redesign a mutually exclusive outcome model and frozen joint scoring rule before
  using posterior probabilities in a future registration.
