# 4. Operationalized Scientific Measurements (M01..M10)
measurements:
  - id: "M01"
    name: "Stratified Type I Gluing False-Certification Rate (beta_A^glue & beta_B^glue)"
    formula: >
      Fraction of environments in Stratum A1 (Discovery, Holdout, Total) and
      Stratum A2 where a black-box-constructed Type I section (`law_bypass_type1`,
      violating a restriction map $\rho_{ij}$ or gauge anchor while excluding Type 0
      pointwise lookup tables) is certified `PASS (score = 1.0)` by Grader A vs. Grader B.
    supports_hypotheses: ["H0", "H1"]

  - id: "M02"
    name: "Total False-Certification Rate Including Type 0 Pointwise Lookups (beta_A^all & beta_B^all)"
    formula: >
      Fraction of environments where either a Type 0 (pointwise input lookup) or
      Type I (gluing/gauge bypass) section is certified `PASS (score = 1.0)` by
      Grader A vs. Grader B (`P01-T-6`).
    supports_hypotheses: ["H0", "H1"]

  - id: "M03"
    name: "Type II Valid-Solution False-Rejection Rate (gamma_A & gamma_B)"
    formula: >
      Fraction of independently verified valid global sections in alternative
      spec-admissible gauges (`reference_alt`, >= 3 independent implementations per
      tested environment verified on >= 1,000 random inputs by an independent
      property-based truth oracle) rejected (`score < 1.0` or `passed == False`)
      by Grader A vs. Grader B (`N03`, `FALS-02`).
    supports_hypotheses: ["H0", "H2"]

  - id: "M04"
    name: "Oracle Gate Escape Rate (ER_4var vs. ER_6var)"
    formula: >
      Fraction of environments where `tools/instance_oracle_gate.py` (4-variant:
      `no_op`, `plausible_wrong`, `transcription`, `reference`) certifies the
      instance as valid while `law_bypass_type1` or `reference_alt` fails its
      expected polarity under the extended 6-variant bidirectional audit.
    supports_hypotheses: ["H1", "H2"]

  - id: "M05"
    name: "Multi-Chart Protocol Gluing Failure Rates (phi_chart, phi_tree, phi_upToGauge, phi_circularAG, phi_sheaf)"
    formula: >
      Fraction of locally passing chart-section tuples $(s_1, s_2, s_3)$ that fail
      the global specification $T_S(X)$ under five orchestration regimes:
      (1) `Chart-Only`, (2) `Pairwise-Tree` (spanning tree $U_{12}, U_{23}$),
      (3) `Pairwise-UpToGauge` (all 3 edges up to unanchored gauge adapters $g_{ij}$),
      (4) `Circular-AG` (`L11` mutually assumed step/boundary invariants without
      cocycle holonomy check), and (5) `Sheaf-Cocycle` ($\delta^0(\{s_i\}) = 0$ and
      $\operatorname{hol}(\gamma) = \mathrm{id}$).
    supports_hypotheses: ["H0", "H3"]

  - id: "M06"
    name: "Empirical Cech 1-Cocycle / Cycle Holonomy Distribution (hol(gamma))"
    formula: >
      Distribution of cycle holonomy $\operatorname{hol}(\gamma) = g_{12} g_{23} g_{31}$
      (specifically integer position shift $\operatorname{pos}_{\text{chunked}} - \operatorname{pos}_{\text{full}} \in \mathbb{Z}$
      in `rope` and step/allocation discrepancy in `rd_*` and `sheaf_physical_constraints`)
      among tuples satisfying all local and spanning-tree / up-to-gauge pairwise checks (`P01-T-9`).
    supports_hypotheses: ["H3"]

  - id: "M07"
    name: "Solo-Chart Gauge Concentration & Diversity (kappa_hat_e & g_hat)"
    formula: >
      Empirical collision probability $\hat{\kappa}_e = \sum_{c \in \mathcal{G}(e)} \hat{p}_{e,c}^2$
      and effective gauge number $\hat{g}_e = 1 / \hat{\kappa}_e$ across solo-chart
      completions, compared against uniform combinatorial baseline $1 / g_e$ (`H4`, `N02`).
    supports_hypotheses: ["H3", "H4"]

  - id: "M08"
    name: "Evaluator–Orchestrator Edge Co-Location (Jaccard(E_J, E_O))"
    formula: >
      $\text{Jaccard}(E_J, E_O) = |E_J \cap E_O| / |E_J \cup E_O|$, where $E_J$ is
      the set of nerve overlap edges unchecked or gauge-unanchored by `Grader A`
      and $E_O$ is the set of overlap edges where `Chart-Only` sections fail to glue (`H5`).
    supports_hypotheses: ["H5"]

  - id: "M09"
    name: "Constraint Parsimony Ratio (Delta_Pred & Delta_LOC)"
    formula: >
      Ratio of predicate count and lines of code (LOC) between `Grader B` /
      sheaf restriction maps $\rho_{ij}$ and a flat pairwise contract suite achieving
      equivalent discrimination (`CR06`, `CTRL07`).
    supports_hypotheses: ["H3"]

  - id: "M10"
    name: "Protocol Coordination Burden (kappa_intervention & kappa_time)"
    formula: >
      Human intervention rate and human time fraction across Mission 01 work packages,
      logged in `mission-01/friction_log.yaml` per `research_protocol/instrumentation.md`.
    supports_hypotheses: []

