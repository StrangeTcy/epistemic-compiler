# 2. Hypotheses (H0..H5)
hypotheses:
  - id: "H0"
    provenance: ["P01-T-7", "P03-S-2"]
    statement: >
      (Null — Local & Pointwise Sufficiency): Existing `judge.py` evaluators in
      `rl_eval_generator` exhibit both low Type I gluing blindness ($\beta_A^{\text{glue}} < 0.20$
      on Stratum A1 `REFERENCES`) and low Type II valid-solution rejection ($\gamma_A < 0.10$),
      and multi-chart `Chart-Only` composition matches `Sheaf-Cocycle` within 10 percentage points.
    falsification_condition: >
      Rejected if $\beta_A^{\text{glue}} \ge 0.20$ on Stratum A1 OR $\gamma_A \ge 0.20$
      OR ($\varphi_{\text{chart}} - \varphi_{\text{sheaf}} > 0.10$).

  - id: "H1"
    provenance: ["P01-T-6", "P03-S-1", "P04-PW"]
    statement: >
      (Type I Oracle Gluing Blindness — N01/N03): Under black-box spec-only candidate
      construction (`CTRL01`), local-projection `judge.py` evaluators (`Grader A`)
      certify globally non-gluable Type I sections (`Type I-A` temporal horizon
      truncation, `Type I-B` unanchored gauge, `Type I-C` hollow-cycle holonomy —
      strictly excluding `Type 0` lookup tables) as `PASS (score = 1.0)` in
      $\beta_A^{\text{glue}} \ge 50\%$ of audited environments (reported separately
      for Stratum A1 `REFERENCES` [Discovery vs. Holdout] and Stratum A2 `compile_only`),
      whereas pre-registered `Grader B` restriction-map checks reduce $\beta_B^{\text{glue}}$
      to $\le 5\%$.
    falsification_condition: >
      Falsified at headline level (`ABORT-01`) if Stratum A1 $\beta_A^{\text{glue}} < 0.50$,
      or if $\beta_B^{\text{glue}} > 0.05$.

  - id: "H2"
    provenance: ["P01-T-2", "P01-T-8", "P03-S-1", "P04-PW"]
    statement: >
      (Type II Oracle Presheaf Inconsistency / Valid-Solution Rejection — N03 Primary Wedge):
      Point-probed `judge.py` evaluators over-anchor spec-unanchored gauges
      ($G_{\text{judge}} \subsetneq G_{\text{spec}}$), falsely rejecting independently
      verified `reference_alt` valid global sections ($\gamma_A > 0.20$ across the
      cohort, and $\ge 60\%$ rejection across $\ge 3$ independent `reference_alt`
      variants per environment on affected environments), whereas pre-registered
      `Grader B` achieves $\gamma_B \le 0.05$ (`ABORT-02`).
    falsification_condition: >
      Falsified if $\gamma_A \le 0.20$ across the cohort, or downgraded from
      "systematic" to "case-study anecdote" if fewer than 5 environments exhibit
      Type II rejection across $\ge 3$ independent `reference_alt` variants (`CR08`),
      or disqualified (`ABORT-02`) if $\gamma_B > 0.05$.

  - id: "H3"
    provenance: ["P01-T-5", "P03-S-1", "P04-PW-5"]
    statement: >
      (Multi-Chart Cycle Holonomy vs. Spanning-Tree & Circular-AG Contracts — N02):
      On multi-chart tasks with non-trivial gauge group $\mathcal{G}$ and closed
      3-cycles (`rope`, `rd_state_carry`, `sheaf_schema_sync`, `sheaf_invariant_gluing`,
      `compositional_optimizer`, `sheaf_physical_constraints`), `Chart-Only`,
      `Pairwise-Tree`, and `Pairwise-UpToGauge` admit non-zero holonomy
      ($\operatorname{hol}(\gamma) \neq 0$, failure rate $\ge 20\%$), and explicit
      zero-cocycle / holonomy enforcement (`Sheaf-Cocycle`) reduces global gluing
      failure to $< 5\%$ while beating `Pairwise-Tree` and `Circular-AG` (`L11`) by
      $\ge 5$ percentage points on $\ge 2$ cyclic environments at $\le$ constraint
      predicate count (`CTRL07`).
    falsification_condition: >
      Falsified (`ABORT-03`) if `Pairwise-Tree` or `Circular-AG` comes within 5
      percentage points of `Sheaf-Cocycle` on $> 80\%$ of multi-chart environments.

  - id: "H4"
    provenance: ["P01-T-7", "P03-S-1", "P04-PW"]
    statement: >
      (Ecological Shared-Prior Gauge Collapse — N02 Negative-Result Alternative):
      Independent solo-chart completions concentrate on a single canonical convention
      per overlap ($\hat{g} < 1.5$, $\hat{\kappa}_e = \sum_c \hat{p}_{e,c}^2 > 0.75$),
      so ecological `Chart-Only` gluing failure is significantly lower than the
      uniform combinatorial baseline $1 - \prod_e (1/g_e)$.
    falsification_condition: >
      Falsified if empirical solo-chart completions exhibit $\hat{g} \ge 1.5$ and
      $\hat{\kappa}_e \le 0.65$ across multi-chart overlaps.

  - id: "H5"
    provenance: ["P01-T-7", "P04-PW"]
    statement: >
      (Evaluator–Orchestrator Duality Co-Location — N01): Across multi-chart tasks,
      the set of overlap edges $E_J$ where `judge.py` fails to enforce restriction
      compatibility co-locates with the set of overlap edges $E_O$ where `Chart-Only`
      gauge orbits fail to glue ($\text{Jaccard}(E_J, E_O) \ge 0.70$).
    falsification_condition: >
      Falsified if $\text{Jaccard}(E_J, E_O) < 0.50$.

