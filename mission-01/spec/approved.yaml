# 8. Executable Falsification Plan (Max 3 Experiments, Max 1 Recursive Round)
falsification_plan:
  max_experiments: 3
  max_recursive_rounds: 1
  experiments:
    - id: "FALS-01"
      attacks: "H1"
      provenance: ["P03-S-1", "CR03", "CR07"]
      design: >
        Execute the black-box-derived Type I gluing audit separately on the 12
        Stratum A1 `REFERENCES` environments (comparing the 5 Discovery environments
        against the 7 previously uninspected Holdout environments) and the 9
        Stratum A2 `compile_only` environments, strictly excluding Type 0 lookup
        bypasses from $\beta_A^{\text{glue}}$.
      survival_threshold: >
        Stratum A1 $\beta_A^{\text{glue}} \ge 0.50$ AND Holdout slice $\beta_A^{\text{glue}} \ge 0.30$
        AND $\beta_B^{\text{glue}} \le 0.05$. Otherwise trigger `ABORT-01` or `ABORT-05`.

    - id: "FALS-02"
      attacks: "H2 and Grader B Overfit"
      provenance: ["P03-S-1", "CR08", "P01-T-8", "P04-PW"]
      design: >
        Construct $\ge 3$ structurally independent `reference_alt` valid global
        sections per environment across $\ge 5$ environments (verified on $\ge 1,000$
        randomized inputs by independent property-based truth oracles that share
        zero code with `judge.py`), and score all `reference_alt` variants under
        both `Grader A` (`judge.py`) and pre-registered `Grader B`.
      survival_threshold: >
        For `Grader B`: false rejection $\gamma_B \le 0.05$ across all independently
        verified `reference_alt` variants (`ABORT-02` if $\gamma_B > 0.05$). For `H2`:
        `Grader A` rejects $\ge 60\%$ of valid alternative gauges on affected environments
        across $\ge 5$ environments (otherwise downgrade `H2` from "systematic" to
        "case-study environments").

    - id: "FALS-03"
      attacks: "H3 and the Sheaf Framing (Pairwise-Tree & Circular-AG Sufficiency + Parsimony)"
      provenance: ["P03-S-1", "CR01", "CR06", "P04-PW-5", "P01-T-5"]
      design: >
        Compare `Chart-Only`, `Pairwise-Tree`, `Pairwise-UpToGauge`, `Circular-AG` (`L11`),
        and `Sheaf-Cocycle` across all 6 multi-chart environments (`rope`, `rd_state_carry`,
        `sheaf_schema_sync`, `sheaf_invariant_gluing`, `compositional_optimizer`,
        `sheaf_physical_constraints`), measuring both global gluing failure rates,
        integer holonomy $\operatorname{hol}(\gamma) \in \mathbb{Z}$, solo-chart gauge
        concentration $\hat{\kappa}_e$ (`H4`), and AST predicate/LOC parsimony (`CTRL07`).
      survival_threshold: >
        `Sheaf-Cocycle` must beat `Pairwise-Tree` and `Circular-AG` by $\ge 5$ percentage
        points on $\ge 2$ cyclic environments with non-trivial holonomy $\operatorname{hol}(\gamma) \neq 0$
        at $\le$ predicate count; otherwise trigger `ABORT-03` (strip sheaf cohomology
        from title/abstract and report as Multi-Interface Contract Audit).

# 9. Mandatory Claim Ceiling & Abort Conditions
claim_ceiling: >
  Mission 01 may claim, at maximum, that within the audited 21-environment subset
  of `StrangeTcy/rl_eval_generator` (reported strictly stratified across the 12
  `REFERENCES` environments in Stratum A1 [split into 5 Discovery and 7 Holdout]
  and the 9 `compile_only` `cat_theo` environments in Stratum A2) and under
  black-box spec-only candidate construction (`CTRL01`), existing point-probed and
  subspace-projected evaluators (`Grader A`) exhibit a measured Bidirectional Oracle
  Error profile: certifying globally non-gluable Type I sections at rate
  $\beta_A^{\text{glue}}$ (95% CI) while falsely rejecting independently verified
  valid global sections in alternative spec-admissible gauges (`reference_alt`) at
  rate $\gamma_A$ (95% CI); and that pre-registered restriction-map and gauge-invariant
  relational checks (`Grader B`) reduce these rates to $\beta_B^{\text{glue}}$ and
  $\gamma_B$. On the 6 multi-chart environments, Mission 01 may report the exact
  gluing failure and integer holonomy $\operatorname{hol}(\gamma) \in \mathbb{Z}$ across
  `Chart-Only`, `Pairwise-Tree`, `Pairwise-UpToGauge`, `Circular-AG` (`L11`), and
  `Sheaf-Cocycle` over the enumerated gauge orbits, alongside the bounded solo-chart
  gauge concentration $\hat{\kappa}_e$ (`H4`). Any headline claim of cohomological
  lift beyond pairwise or circular assume-guarantee contracts is admissible if and
  only if `FALS-03` demonstrates $\ge 5$pp separation between `Sheaf-Cocycle` and
  both `Pairwise-Tree` and `Circular-AG` on $\ge 2$ environments.

cannot_justify:
  - 'Cannot claim mathematical novelty for sheaf theory, restriction maps, or Cech cohomology (`K02`, `L06`, `L07`), nor claim to be the first to propose sheaf cohomology for multi-agent AI/RL systems (`L08`: Schmid, April 2025, arXiv:2504.17700).'
  - 'Cannot pool Stratum A1 (`REFERENCES`) and Stratum A2 (`compile_only`) into a single unstratified headline percentage (`CTRL02`), nor conflate Type 0 lookup tables with Type I gluing bypasses (`P01-T-6`).'
  - 'Cannot claim that uniform combinatorial gauge-mixing failure rates ($1 - \prod_e (1/g_e)$) represent ecological multi-agent LLM failure rates (`CTRL04`); ecological rates are bounded by measured solo-chart gauge concentration $\hat{\kappa}_e$ (`H4`, `C8`).'
  - 'Cannot retain "sheaf cohomology" or "cocycle" in the paper title/abstract if `Sheaf-Cocycle` fails to beat `Pairwise-Tree` and `Circular-AG` (`L11`) by >= 5pp on >= 2 environments (`ABORT-03`, `C7`).'
  - 'Cannot claim `H2` (Type II valid-solution rejection) is systematic across the benchmark unless demonstrated across >= 3 independent `reference_alt` implementations on >= 5 environments (`CR08`, `FALS-02`).'
  - 'Cannot cite `SWE-ABS` without a resolvable primary arXiv/DOI identifier (`C6`).'

abort_conditions:
  - id: "ABORT-01"
    condition: "Stratum A1 `REFERENCES` Type I gluing blindness beta_A^glue < 0.50 -> H1 headline falsified; report negative/partial Stratum A1 result and restrict primary positive claim to N03 Type II / Stratum A2."
  - id: "ABORT-02"
    condition: "Grader B false-rejection rate gamma_B > 0.05 on independently verified `reference_alt` solutions -> Grader B disqualified as overfit; must be revised and re-evaluated."
  - id: "ABORT-03"
    condition: "`Pairwise-Tree` or `Circular-AG` (`L11`) comes within 5pp of `Sheaf-Cocycle` on >= 80% of multi-chart environments -> strike sheaf/cohomology from title and abstract (`C7`) and report as Multi-Interface Contract Audit."
  - id: "ABORT-04"
    condition: "Solo-chart gauge diversity g_hat < 1.5 (kappa_hat_e > 0.75) on > 50% of multi-chart overlaps -> H4 (Shared-Prior Collapse) confirmed; report ecological gauge convergence as a primary negative result per `C8`."
  - id: "ABORT-05"
    condition: "Stratum A1 Holdout Slice (7 previously uninspected `REFERENCES` environments) exhibits beta_A^glue < 0.30 -> selection bias confirmed (`CR07`); downgrade H1 to case studies on the Discovery slice."
