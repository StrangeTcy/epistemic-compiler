# 6. Confound & Circularity Controls (CTRL01..CTRL08)
controls:
  - id: "CTRL01"
    mitigates: "CF01 (White-Box Exploit Crafting)"
    specification: >
      All `law_bypass_type1` and `reference_alt` patches must be derived strictly
      from black-box task specifications (`prompt.md`, `visible_tests.py`, and
      workspace source files), without inspecting `judge.py` constants. Each candidate
      carries a logged SHA256 of the black-box context bundle.
  - id: "CTRL02"
    mitigates: "CF02 (compile_only Dilution)"
    specification: >
      Strict stratified reporting of Stratum A1 (12 `REFERENCES` environments, further
      split into 3 Discovery + 9 uninspected Holdout environments) and Stratum A2
      (9 `compile_only` `cat_theo` environments). Never pool A1 and A2 into an
      unstratified headline percentage.
  - id: "CTRL03"
    mitigates: "CF03 (Post-Hoc Grader B Fit)"
    specification: >
      Pre-register `mission-01/spec/approved.yaml` and the restriction-map invariants
      for `Grader B` with a locked Git commit SHA on `StrangeTcy/epistemic-compiler`
      prior to executing the Part A and Part B evaluation runs.
  - id: "CTRL04"
    mitigates: "CF04 (Uniform-Random Gauge Combinatorics)"
    specification: >
      Explicitly separate Track B-Mech (deterministic evaluation over the Cartesian
      product of gauge orbits $\prod_i \mathcal{G}(U_i)$) from Track B-Emp (empirical
      solo-chart gauge concentration $\hat{\kappa}_e$ / $\hat{g}$), and never attribute
      combinatorial uniform-mix failure rates to LLM agent behavior.
  - id: "CTRL05"
    mitigates: "CF05 (Pairwise == Sheaf Collapse) & L11 (Circular-AG)"
    specification: >
      Include both `Pairwise-Tree`, `Pairwise-UpToGauge`, and `Circular-AG` (`L11`)
      as explicit comparators against `Sheaf-Cocycle`. Strike sheaf cohomology from
      any headline claim if `Sheaf-Cocycle` fails to beat `Pairwise-Tree` and
      `Circular-AG` by >= 5pp on >= 2 cyclic environments (`ABORT-03`).
  - id: "CTRL06"
    mitigates: "CF06 (REFERENCES Curation Contamination)"
    specification: >
      Evaluate all 9 previously uninspected `REFERENCES` environments (`moco`, `glyph`,
      `epistemic_games`, `regex_state_machine`, `sql_fixed_point`, `css_state_machine`,
      `spreadsheet_dataflow`, `template_interpreter`, `ci_dependency_graph`) as an
      uncontaminated Holdout Slice alongside the 3 Discovery `REFERENCES` environments,
      and validate every `reference_alt` with an independent property-based truth
      oracle over >= 1,000 randomized inputs.
  - id: "CTRL07"
    mitigates: "CF07 (Constraint-Count Inflation)"
    specification: >
      Measure and report predicate count and LOC of `Grader B` / $\rho_{ij}$ restriction
      checks vs. flat pairwise contract suites (`M09`).
  - id: "CTRL08"
    mitigates: "CF08 (Trajectory-Narration Penalty)"
    specification: >
      `Grader B` and all restriction-map checks operate strictly on the final submitted
      code artifact; episode trajectory / scratchpad logs are inadmissible to pass/fail
      grading.

# 7. Engineering Requirements (R01..R06) & Outcome-Neutral Acceptance Tests (T01..T06)
engineering_requirements:
  - id: "R01"
    description: >
      Implement an independent property-based Truth Oracle & Bidirectional Audit
      Harness (`tools/bidirectional_oracle_audit.py`) that evaluates `Grader A`
      (`judge.py`) and pre-registered `Grader B` (restriction-map auditor) across
      all 21 Part A environments (12 Stratum A1 `REFERENCES` + 9 Stratum A2 `cat_theo`)
      on 6 patch variants (`no_op`, `plausible_wrong`, `transcription`, `law_bypass_type0`,
      `law_bypass_type1`, `reference`, and $\ge 3$ `reference_alt` variants on Type II
      target environments).
  - id: "R02"
    description: >
      Enforce black-box context hashing (`CTRL01`): compute and record the SHA256
      digest of the agent-visible workspace (`prompt.md`, `visible_tests.py`, and
      patchable source files, excluding `judge.py`) for every audited environment.
  - id: "R03"
    description: >
      Implement the Multi-Chart Gluing & Holonomy Benchmark (`tools/multichart_gluing_benchmark.py`)
      supporting all 5 orchestration regimes (`Chart-Only`, `Pairwise-Tree`,
      `Pairwise-UpToGauge`, `Circular-AG`, `Sheaf-Cocycle`) across the 6 multi-chart
      environments (`rope`, `rd_state_carry`, `sheaf_schema_sync`,
