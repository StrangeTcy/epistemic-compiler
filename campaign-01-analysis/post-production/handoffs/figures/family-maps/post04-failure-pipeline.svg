<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title desc">
<title id="title">A reading map of POST-04 failure labels along an evaluation pipeline</title>
<desc id="desc">The 61 eligible failures are grouped by recorded label at action and patch, source validation, runtime, and judge or record stages. Two provider-terminal rows are outside the 192-row analysis set, and pre-scoring omissions have no pass or fail result. This is a reading map, not a causal execution trace.</desc>
<rect x="0" y="0" width="1240" height="540" fill="#fbfaf7"/>
<text x="24.0" y="39.0" font-family="Inter,Arial,sans-serif" font-size="22px" font-weight="700" fill="#182631" text-anchor="start" >A red result can enter the record at different points</text>
<text x="24.0" y="68.0" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#52616d" text-anchor="start" >Nominal handoffs between stages · cards list recorded labels · not a trace of one execution</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52616d"/></marker></defs>
<line x1="245" y1="144.0" x2="273" y2="144.0" stroke="#52616d" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="116" width="200" height="56" rx="8" fill="#fff7e6" stroke="#c58a18" stroke-width="1.2"/>
<text x="140.0" y="151.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="middle" >Provider response</text>
<rect x="40" y="190" width="200" height="114" rx="7" fill="#fff7e6" stroke="#c58a18" stroke-width="1"/>
<text x="140.0" y="218.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#52616d" text-anchor="middle"><tspan x="140.0" dy="0">2 provider-terminal rows</tspan><tspan x="140.0" dy="20">outside the 192-row set</tspan><tspan x="140.0" dy="20">raw label: invalid_action</tspan></text>
<line x1="485" y1="144.0" x2="513" y2="144.0" stroke="#52616d" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="280" y="116" width="200" height="56" rx="8" fill="#edf1f3" stroke="#d5dde2" stroke-width="1.2"/>
<text x="380.0" y="151.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="middle" >Action / patch</text>
<rect x="280" y="190" width="200" height="114" rx="7" fill="#ffffff" stroke="#d5dde2" stroke-width="1"/>
<text x="380.0" y="218.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#52616d" text-anchor="middle"><tspan x="380.0" dy="0">24 patch_invalid: empty patch file</tspan><tspan x="380.0" dy="20">2 eligible invalid_action rows</tspan><tspan x="380.0" dy="20">malformed action or patch JSON</tspan></text>
<line x1="725" y1="144.0" x2="753" y2="144.0" stroke="#52616d" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="520" y="116" width="200" height="56" rx="8" fill="#edf1f3" stroke="#d5dde2" stroke-width="1.2"/>
<text x="620.0" y="151.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="middle" >Source validation</text>
<rect x="520" y="190" width="200" height="114" rx="7" fill="#ffffff" stroke="#d5dde2" stroke-width="1"/>
<text x="620.0" y="218.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#52616d" text-anchor="middle"><tspan x="620.0" dy="0">10 source_invalid rows</tspan><tspan x="620.0" dy="20">validator rejection</tspan><tspan x="620.0" dy="20">before execution</tspan></text>
<line x1="965" y1="144.0" x2="993" y2="144.0" stroke="#52616d" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="760" y="116" width="200" height="56" rx="8" fill="#edf1f3" stroke="#d5dde2" stroke-width="1.2"/>
<text x="860.0" y="151.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="middle" >Runtime</text>
<rect x="760" y="190" width="200" height="114" rx="7" fill="#ffffff" stroke="#d5dde2" stroke-width="1"/>
<text x="860.0" y="218.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#52616d" text-anchor="middle"><tspan x="860.0" dy="0">3 runtime_error rows</tspan><tspan x="860.0" dy="20">execution failures</tspan><tspan x="860.0" dy="20">after source validation</tspan></text>
<rect x="1000" y="116" width="200" height="56" rx="8" fill="#edf1f3" stroke="#d5dde2" stroke-width="1.2"/>
<text x="1100.0" y="151.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="middle" >Judge / stored label</text>
<rect x="1000" y="190" width="200" height="114" rx="7" fill="#ffffff" stroke="#d5dde2" stroke-width="1"/>
<text x="1100.0" y="218.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="500" fill="#52616d" text-anchor="middle"><tspan x="1100.0" dy="0">20 underfit score shortfalls</tspan><tspan x="1100.0" dy="20">2 overfit labels conflict</tspan><tspan x="1100.0" dy="20">with trusted scores and final notes</tspan></text>
<rect x="40" y="330" width="1160" height="82" rx="8" fill="#f4f2ed" stroke="#d5dde2"/>
<text x="58.0" y="357.0" font-family="Inter,Arial,sans-serif" font-size="14px" font-weight="700" fill="#182631" text-anchor="start" >61 eligible FAIL labels</text>
<text x="58.0" y="382.0" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#52616d" text-anchor="start" >24 empty patch files + 2 malformed actions + 10 validator rejections + 3 runtime errors + 20 underfit + 2 conflicting overfit labels</text>
<text x="58.0" y="402.0" font-family="Inter,Arial,sans-serif" font-size="11px" font-weight="400" fill="#52616d" text-anchor="start" >The separate 24 pre-scoring omissions have no scored outcome; they are neither PASS nor FAIL.</text>
<text x="40.0" y="455.0" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="600" fill="#52616d" text-anchor="start" >The provider-terminal rows remain in the raw checkpoint but are outside the eligible-failure total.</text>
<text x="40.0" y="481.0" font-family="Inter,Arial,sans-serif" font-size="12px" font-weight="400" fill="#52616d" text-anchor="start" >The labels distinguish recorded events; they do not identify who caused a stop or diagnose a reasoning process.</text>
</svg>
