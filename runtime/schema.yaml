$schema: https://json-schema.org/draft/2020-12/schema
$title: Epistemic Compiler Local Mission Runtime
$comment: >-
  Structural schema for mission YAML. The runner validates this shape directly,
  then performs semantic checks for dependency references/cycles, artifact paths,
  unique outputs and resumable state. Artifact references are mission:<input_id>,
  job:<job_id>:response, or a path relative to the mission YAML. Persisted job
  statuses are queued, running, completed, failed, blocked, waiting_for_human.
type: object
additionalProperties: false
required: [mission_id, jobs]
properties:
  mission_id:
    type: string
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  type:
    type: string
    minLength: 1
  inputs:
    oneOf:
      - type: object
        additionalProperties:
          type: string
          minLength: 1
      - type: array
        items:
          oneOf:
            - type: string
              minLength: 1
            - type: object
              additionalProperties: false
              required: [id, path]
              properties:
                id: {type: string, minLength: 1}
                path: {type: string, minLength: 1}
  defaults:
    type: object
    properties:
      site: {type: string, minLength: 1}
      model: {type: [string, 'null']}
      profile: {type: [string, 'null']}
      timeout_seconds: {type: integer, minimum: 10}
    additionalProperties: false
  jobs:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/job'
$defs:
  job:
    type: object
    required: [role, prompt_artifact]
    properties:
      id:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      job_id:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      mission_id: {type: string, minLength: 1}
      role: {type: string, minLength: 1}
      prompt_artifact: {type: string, minLength: 1}
      input_artifacts:
        oneOf:
          - type: string
            minLength: 1
          - type: array
            items: {type: string, minLength: 1}
      dependencies:
        oneOf:
          - type: string
            minLength: 1
          - type: array
            items: {type: string, minLength: 1}
      depends_on:
        oneOf:
          - type: string
            minLength: 1
          - type: array
            items: {type: string, minLength: 1}
      site: {type: string, minLength: 1}
      provider: {type: string, minLength: 1}
      model: {type: [string, 'null']}
      profile: {type: [string, 'null']}
      output_artifact: {type: string, minLength: 1}
      timeout_seconds: {type: integer, minimum: 10}
    allOf:
      - anyOf:
          - required: [id]
          - required: [job_id]
    additionalProperties: false
  execution_status:
    description: Persisted runtime state only; never placed in mission YAML.
    enum: [queued, running, completed, failed, blocked, waiting_for_human]
